openapi: 3.0.3
info:
  title: RevieU API
  version: 1.0.0
  description: Auth + Customer API for RevieU
servers:
  - url: /api/v1
    description: Default API base
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: users
  - name: feed
  - name: merchants
  - name: reviews
  - name: coupons
  - name: vouchers
  - name: payments
  - name: media
  - name: ai
  - name: merchant
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/register:
    post:
      tags: [auth]
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Send reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/me:
    get:
      tags: [auth]
      summary: Get current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/login/google:
    get:
      tags: [auth]
      summary: Get Google OAuth URL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
  /user/profile:
    get:
      tags: [users]
      summary: Get user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags: [users]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /feed/home:
    get:
      tags: [feed]
      summary: Home feed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedItem'
  /merchants:
    get:
      tags: [merchants]
      summary: List merchants
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: tags
          schema:
            type: string
        - in: query
          name: lat
          schema:
            type: number
        - in: query
          name: lng
          schema:
            type: number
        - in: query
          name: radius
          schema:
            type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Merchant'
  /merchants/{id}:
    get:
      tags: [merchants]
      summary: Merchant detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
  /merchants/{id}/reviews:
    get:
      tags: [merchants]
      summary: Merchant reviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
  /user/reviews:
    get:
      tags: [users]
      summary: List my reviews
      parameters:
        - in: query
          name: cursor
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  total:
                    type: integer
                  cursor:
                    type: integer
                    nullable: true
  /reviews:
    post:
      tags: [reviews]
      summary: Create review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
  /reviews/{id}:
    get:
      tags: [reviews]
      summary: Review detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
  /reviews/{id}/like:
    post:
      tags: [reviews]
      summary: Like review
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /reviews/{id}/comments:
    post:
      tags: [reviews]
      summary: Comment on review
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '201':
          description: Created
  /coupons/{id}/validate:
    post:
      tags: [coupons]
      summary: Validate coupon
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /coupons/{id}/payment/initiate:
    post:
      tags: [coupons]
      summary: Initiate coupon payment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        '200':
          description: OK
  /coupons/{id}/redeem:
    post:
      tags: [coupons]
      summary: Redeem free coupon
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /vouchers:
    post:
      tags: [vouchers]
      summary: Create voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Voucher'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
    get:
      tags: [vouchers]
      summary: List vouchers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Voucher'
  /vouchers/{id}:
    get:
      tags: [vouchers]
      summary: Voucher detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /vouchers/code/{code}:
    get:
      tags: [vouchers]
      summary: Voucher by code
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /vouchers/{id}/use:
    patch:
      tags: [vouchers]
      summary: Mark voucher used
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /vouchers/{id}/status:
    patch:
      tags: [vouchers]
      summary: Update voucher status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /vouchers/share/email:
    post:
      tags: [vouchers]
      summary: Share voucher via email
      responses:
        '200':
          description: OK
  /vouchers/share/sms:
    post:
      tags: [vouchers]
      summary: Share voucher via sms
      responses:
        '200':
          description: OK
  /payments:
    post:
      tags: [payments]
      summary: Create payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
  /payments/{id}:
    get:
      tags: [payments]
      summary: Payment detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
  /media/uploads:
    post:
      tags: [media]
      summary: Create upload URL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUpload'
  /media/{id}/analysis:
    post:
      tags: [media]
      summary: Analyze media
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /ai/reviews/suggestions:
    post:
      tags: [ai]
      summary: Polish a draft review with AI
      description: Sends a draft review (text + optional images) to Gemini and returns three polished candidates as plain text.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIPolishRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIPolishResponse'
  /merchant/stores:
    get:
      tags: [merchant]
      summary: List my stores
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Owned stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Store'
        '401': { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [merchant]
      summary: Create a merchant store
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Store'
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /merchant/stores/{id}:
    patch:
      tags: [merchant]
      summary: Update an owned store
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUpdateRequest'
      responses:
        '200':
          description: Store updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Store'
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [merchant]
      summary: Delete an owned store
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreID'
      responses:
        '200': { description: Store deleted }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /merchant/stores/{id}/activate:
    post:
      tags: [merchant]
      summary: Publish an owned store
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreID'
      responses:
        '200': { description: Store published }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /merchant/stores/{id}/deactivate:
    post:
      tags: [merchant]
      summary: Hide an owned store
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreID'
      responses:
        '200': { description: Store hidden }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /merchant/stores/{id}/coupons:
    get:
      tags: [merchant]
      summary: List all coupons for an owned store
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreID'
      responses:
        '200':
          description: Store coupons
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantCoupon'
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [merchant]
      summary: Create a store coupon
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponCreateRequest'
      responses:
        '201':
          description: Coupon created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MerchantCoupon'
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /merchant/stores/{id}/coupons/{couponId}:
    patch:
      tags: [merchant]
      summary: Update a store coupon
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreID'
        - $ref: '#/components/parameters/CouponID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponUpdateRequest'
      responses:
        '200':
          description: Coupon updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MerchantCoupon'
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [merchant]
      summary: Delete a store coupon
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreID'
        - $ref: '#/components/parameters/CouponID'
      responses:
        '200': { description: Coupon deleted }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /merchant/stores/{id}/coupons/{couponId}/enable:
    post:
      tags: [merchant]
      summary: Enable a store coupon
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreID'
        - $ref: '#/components/parameters/CouponID'
      responses:
        '200': { description: Coupon enabled }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /merchant/stores/{id}/coupons/{couponId}/disable:
    post:
      tags: [merchant]
      summary: Disable a store coupon
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreID'
        - $ref: '#/components/parameters/CouponID'
      responses:
        '200': { description: Coupon disabled }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /merchant/dishes:
    get:
      tags: [merchant]
      summary: List my dishes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Merchant dishes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dish'
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [merchant]
      summary: Create a dish
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishUpsertRequest'
      responses:
        '201':
          description: Dish created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Dish'
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /merchant/dishes/{id}:
    patch:
      tags: [merchant]
      summary: Update a dish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DishID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishUpdateRequest'
      responses:
        '200': { description: Dish updated }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [merchant]
      summary: Delete a dish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DishID'
      responses:
        '200': { description: Dish deleted }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /merchant/dishes/{id}/enable:
    post:
      tags: [merchant]
      summary: Enable a dish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DishID'
      responses:
        '200': { description: Dish enabled }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /merchant/dishes/{id}/disable:
    post:
      tags: [merchant]
      summary: Disable a dish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DishID'
      responses:
        '200': { description: Dish disabled }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    StoreID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CouponID:
      name: couponId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DishID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthRegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
    AuthTokenResponse:
      type: object
      required: [access_token, refresh_token, type]
      properties:
        token:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        type:
          type: string
          example: Bearer
    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    AuthUser:
      type: object
      required: [user_id, email, role]
      properties:
